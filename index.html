<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // Financial constants
        const DEAL_PARAMS = {
            purchasePrice: 2000000,
            clubDeposit: 150000, // Builder's Program deposit
            refundableDeposit: 75000, // 50% refundable at sale (3-year window)
            closingCostsPct: 0.035,
            dueDiligence: 7500,
            buildCostPerSqFt: 600, // Updated to $600/sf for luxury build
            homeSize: 7000,
            contingencyPct: 0.12,
            architectFees: 150000, // Fixed architect fee
            permitsAndFees: 80000,
            clubDuesAnnual: 70000,
            propertyTaxPct: 0.018,
            insurancePct: 0.0075,
            utilitiesMonthly: 500,
            buildMonths: 18,
            sellMonths: 4,
            sellingCostsPct: 0.07,
            investorReturnPct: 0.15, // 15% total return target
            edmundEquity: 0.05, // 5% equity ownership
            builderEquity: 0.05, // 5% equity ownership
            investorEquity: 0.90, // 90% equity ownership
            edmundCommissionPct: 0.06
        };

        function formatCurrency(value) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(value);
        }

        function formatPercent(value) {
            return (value * 100).toFixed(2) + '%';
        }

        // Calculate IRR using Newton-Raphson method
        function calculateIRR(cashFlows) {
            const maxIterations = 100;
            const tolerance = 0.00001;
            let guess = 0.1; // Start with 10% guess

            for (let i = 0; i < maxIterations; i++) {
                let npv = 0;
                let dnpv = 0;

                for (let t = 0; t < cashFlows.length; t++) {
                    npv += cashFlows[t] / Math.pow(1 + guess, t / 12); // Monthly periods
                    dnpv += (-t / 12) * cashFlows[t] / Math.pow(1 + guess, (t / 12) + 1);
                }

                const newGuess = guess - npv / dnpv;

                if (Math.abs(newGuess - guess) < tolerance) {
                    return newGuess;
                }

                guess = newGuess;
            }

            return guess; // Return best guess after max iterations
        }

        function calculateDealMetrics(salePrice, buildCostPerSf = DEAL_PARAMS.buildCostPerSqFt, timelineMonths = null) {
            const p = { ...DEAL_PARAMS, buildCostPerSqFt: buildCostPerSf };
            const totalMonths = timelineMonths || (p.buildMonths + p.sellMonths);

            // Acquisition costs
            const closingCosts = p.purchasePrice * p.closingCostsPct;
            const totalAcquisition = p.purchasePrice + closingCosts + p.dueDiligence + (p.clubDeposit - p.refundableDeposit);

            // Development costs
            const buildCost = p.buildCostPerSqFt * p.homeSize;
            const contingency = buildCost * p.contingencyPct;
            const architect = p.architectFees;
            const totalDevelopment = buildCost + contingency + architect + p.permitsAndFees;

            // Carrying costs
            const clubDuesTotal = (p.clubDuesAnnual / 12) * totalMonths;
            const propertyTaxTotal = (p.purchasePrice * p.propertyTaxPct / 12) * totalMonths;
            const insuranceTotal = (p.purchasePrice * p.insurancePct / 12) * totalMonths;
            const utilitiesTotal = p.utilitiesMonthly * totalMonths;
            const totalCarrying = clubDuesTotal + propertyTaxTotal + insuranceTotal + utilitiesTotal;

            // Total capital invested
            const totalCapital = totalAcquisition + totalDevelopment + totalCarrying;

            // Exit calculations
            const sellingCosts = salePrice * p.sellingCostsPct;
            const realtorCommissions = salePrice * p.edmundCommissionPct; // Total buyer + seller agent commissions
            const netProceeds = salePrice - sellingCosts + p.refundableDeposit;
            const grossProfit = netProceeds - totalCapital;

            // Profit-based carried interest (10% of profit off the top)
            const carriedInterestTotal = Math.max(0, grossProfit * 0.10);
            const edmundCarriedInterest = carriedInterestTotal * 0.50; // 5% of profit
            const builderCarriedInterest = carriedInterestTotal * 0.50; // 5% of profit

            // Remaining profit to investors (90% of profit)
            const investorProfitShare = Math.max(0, grossProfit * 0.90);

            // Total distributions
            // If there's a loss (negative profit), investors only get net proceeds available
            // If there's a profit, investors get capital back + their 90% profit share
            const investorTotal = grossProfit >= 0
                ? totalCapital + investorProfitShare
                : netProceeds - carriedInterestTotal;

            const edmundTotal = edmundCarriedInterest; // Edmund's actual profit (carried interest only)
            const builderTotal = builderCarriedInterest;

            // Investor return analysis
            const investorPreferredReturn = totalCapital * p.investorReturnPct;
            const totalNeededForInvestors = totalCapital + investorPreferredReturn;
            const investorShortfall = totalNeededForInvestors - investorTotal;

            // ROI calculations
            const investorROI = investorProfitShare / totalCapital;
            const overallROI = grossProfit / totalCapital;

            // IRR Calculation - Build cash flow array
            const monthlyCarryingCost = totalCarrying / totalMonths;
            const cashFlows = [];

            // Month 0: Initial capital outlay (negative)
            cashFlows.push(-totalCapital);

            // Months 1 through totalMonths-1: Monthly carrying costs (negative)
            for (let i = 1; i < totalMonths; i++) {
                cashFlows.push(-monthlyCarryingCost);
            }

            // Final month: Exit proceeds (positive)
            cashFlows.push(investorTotal - monthlyCarryingCost);

            const irr = calculateIRR(cashFlows);
            const irrAnnualized = irr;

            return {
                totalMonths,
                totalCapital,
                totalAcquisition,
                totalDevelopment,
                totalCarrying,
                salePrice,
                sellingCosts,
                realtorCommissions,
                netProceeds,
                grossProfit,
                carriedInterestTotal,
                edmundCarriedInterest,
                builderCarriedInterest,
                investorProfitShare,
                investorPreferredReturn,
                totalNeededForInvestors,
                investorShortfall,
                edmundTotal,
                builderTotal,
                investorTotal,
                investorROI,
                overallROI,
                irr,
                irrAnnualized,
                breakdown: {
                    acquisition: {
                        purchasePrice: p.purchasePrice,
                        clubDepositNonRefundable: p.clubDeposit - p.refundableDeposit,
                        closingCosts,
                        dueDiligence: p.dueDiligence
                    },
                    development: {
                        buildCost,
                        contingency,
                        architect,
                        permits: p.permitsAndFees
                    },
                    carrying: {
                        clubDues: clubDuesTotal,
                        propertyTax: propertyTaxTotal,
                        insurance: insuranceTotal,
                        utilities: utilitiesTotal
                    }
                }
            };
        }

        function App() {
            const [salePrice, setSalePrice] = useState(8900000);
            const [buildCostPerSf, setBuildCostPerSf] = useState(525);

            const metrics = useMemo(() => calculateDealMetrics(salePrice, buildCostPerSf), [salePrice, buildCostPerSf]);
            // True breakeven: investors get capital back (0% return)
            const trueBreakeven = useMemo(() => {
                let low = 6000000, high = 12000000;
                while (high - low > 1000) {
                    const mid = (low + high) / 2;
                    const m = calculateDealMetrics(mid, buildCostPerSf);
                    if (m.investorTotal < m.totalCapital) low = mid;
                    else high = mid;
                }
                return high;
            }, [buildCostPerSf]);

            // 15% return target: investors get capital + 15% return
            const targetReturn = useMemo(() => {
                let low = 7000000, high = 15000000;
                while (high - low > 1000) {
                    const mid = (low + high) / 2;
                    const m = calculateDealMetrics(mid, buildCostPerSf);
                    if (m.investorShortfall > 0) low = mid;
                    else high = mid;
                }
                return high;
            }, [buildCostPerSf]);

            const meetsInvestorReturn = metrics.investorShortfall <= 0;

            return (
                <div className="container">
                    <div className="header">
                        <h1>St Andrews Investment Analysis</h1>
                        <p>Luxury Development ROI Calculator | Edmund Bogen Team</p>
                    </div>

                    {/* Property Showcase */}
                    <div className="property-showcase">
                        <img src="property.jpg" alt="St Andrews Luxury Development Opportunity" />
                        <div className="property-caption">
                            <h3>St Andrews Country Club Development Opportunity</h3>
                            <p style={{fontSize: '16px', marginTop: '10px', opacity: '0.95', letterSpacing: '1px'}}>17651 Foxborough Lane</p>
                        </div>
                    </div>

                    {/* Executive Summary */}
                    <div className="card" style={{background: 'linear-gradient(to bottom right, #f8f9fa 0%, #e9ecef 100%)', border: '2px solid #00a8e1'}}>
                        <h2 style={{borderBottom: '3px solid #1a3e5c'}}>Executive Summary</h2>
                        <div style={{lineHeight: '1.8'}}>
                            <p style={{fontSize: '16px', marginBottom: '20px', color: '#1a3e5c', fontWeight: '500'}}>
                                Luxury new construction development opportunity at St Andrews Country Club in Boca Raton, Florida.
                                7,000 square foot modern residence with projected exit valuation of $9.0M based on professional
                                comparative market analysis.
                            </p>

                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '15px', marginBottom: '25px'}}>
                                <div style={{padding: '15px', background: 'white', borderRadius: '6px', borderLeft: '4px solid #00a000'}}>
                                    <div style={{fontSize: '13px', color: '#666', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '5px'}}>
                                        Investment Structure
                                    </div>
                                    <div style={{fontSize: '18px', fontWeight: '600', color: '#1a3e5c'}}>
                                        90/10 Profit Split
                                    </div>
                                    <div style={{fontSize: '13px', color: '#666', marginTop: '5px'}}>
                                        90% investors, 10% carried interest
                                    </div>
                                </div>

                                <div style={{padding: '15px', background: 'white', borderRadius: '6px', borderLeft: '4px solid #00a8e1'}}>
                                    <div style={{fontSize: '13px', color: '#666', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '5px'}}>
                                        Base Case IRR
                                    </div>
                                    <div style={{fontSize: '18px', fontWeight: '600', color: '#1a3e5c'}}>
                                        {formatPercent(metrics.irr)}
                                    </div>
                                    <div style={{fontSize: '13px', color: '#666', marginTop: '5px'}}>
                                        22-month timeline
                                    </div>
                                </div>

                                <div style={{padding: '15px', background: 'white', borderRadius: '6px', borderLeft: '4px solid #7b1fa2'}}>
                                    <div style={{fontSize: '13px', color: '#666', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '5px'}}>
                                        Projected Profit
                                    </div>
                                    <div style={{fontSize: '18px', fontWeight: '600', color: metrics.grossProfit > 0 ? '#00a000' : '#d32f2f'}}>
                                        {formatCurrency(metrics.grossProfit)}
                                    </div>
                                    <div style={{fontSize: '13px', color: '#666', marginTop: '5px'}}>
                                        At $9M exit price
                                    </div>
                                </div>

                                <div style={{padding: '15px', background: 'white', borderRadius: '6px', borderLeft: '4px solid #f57c00'}}>
                                    <div style={{fontSize: '13px', color: '#666', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '5px'}}>
                                        Market Support
                                    </div>
                                    <div style={{fontSize: '18px', fontWeight: '600', color: '#1a3e5c'}}>
                                        $8.5M - $9.5M
                                    </div>
                                    <div style={{fontSize: '13px', color: '#666', marginTop: '5px'}}>
                                        CMA value range
                                    </div>
                                </div>
                            </div>

                            <div style={{background: 'white', padding: '20px', borderRadius: '8px', marginBottom: '20px'}}>
                                <h3 style={{color: '#1a3e5c', fontSize: '16px', marginBottom: '15px'}}>Investment Highlights</h3>
                                <ul style={{marginLeft: '20px', lineHeight: '1.9'}}>
                                    <li><strong>Prime Location:</strong> Foxborough Lane, St Andrews Country Club - same community as recent $13.16M sale (1 day DOM)</li>
                                    <li><strong>Market-Tested Pricing:</strong> $9M exit supported by 4 comparable sales, professional CMA valuation</li>
                                    <li><strong>Rapid Absorption:</strong> Comparable properties selling in 10-21 days when priced correctly</li>
                                    <li><strong>Builder's Program:</strong> $150K deposit ($75K refundable) reduces upfront capital requirement</li>
                                    <li><strong>Risk Mitigation:</strong> 12% contingency, fixed architect fees, locked material pricing</li>
                                    <li><strong>Experienced Team:</strong> Edmund Bogen (St Andrews resident, record-breaking sales) + established luxury builder</li>
                                </ul>
                            </div>

                            <div style={{background: '#fff3cd', padding: '15px', borderRadius: '6px', borderLeft: '4px solid #ffc107'}}>
                                <strong>Key Risk Factors:</strong> Construction timeline delays, market absorption risk, interest rate sensitivity,
                                luxury market volatility. See detailed risk scenarios and mitigation strategies in Timeline & IRR Analysis section below.
                            </div>
                        </div>
                    </div>

                    {/* Deal Summary */}
                    <div className="card">
                        <h2>Investment Summary</h2>
                        <div className="metrics-grid">
                            <div className="metric">
                                <div className="metric-label">Total Capital Required</div>
                                <div className="metric-value">{formatCurrency(metrics.totalCapital)}</div>
                            </div>
                            <div className="metric">
                                <div className="metric-label">Build Timeline</div>
                                <div className="metric-value">{DEAL_PARAMS.buildMonths + DEAL_PARAMS.sellMonths} Months</div>
                            </div>
                            <div className="metric">
                                <div className="metric-label">True Breakeven</div>
                                <div className="metric-value">{formatCurrency(trueBreakeven)}</div>
                                <div style={{fontSize: '12px', color: '#666', marginTop: '5px'}}>
                                    Capital recovery (0% return)
                                </div>
                            </div>
                            <div className="metric">
                                <div className="metric-label">Projected Return Scenario</div>
                                <div className="metric-value">{formatCurrency(targetReturn)}</div>
                                <div style={{fontSize: '12px', color: '#666', marginTop: '5px'}}>
                                    Price for 15% ROI
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Cost Breakdown */}
                    <div className="card">
                        <h2>Cost Breakdown</h2>
                        <div className="cost-breakdown">
                            <div className="cost-section">
                                <h3>Acquisition Costs</h3>
                                <div className="cost-item">
                                    <span>Purchase Price</span>
                                    <span>{formatCurrency(metrics.breakdown.acquisition.purchasePrice)}</span>
                                </div>
                                <div className="cost-item">
                                    <span>Club Deposit (Non-Refundable)</span>
                                    <span>{formatCurrency(metrics.breakdown.acquisition.clubDepositNonRefundable)}</span>
                                </div>
                                <div className="cost-item">
                                    <span>Closing Costs (3.5%)</span>
                                    <span>{formatCurrency(metrics.breakdown.acquisition.closingCosts)}</span>
                                </div>
                                <div className="cost-item">
                                    <span>Due Diligence</span>
                                    <span>{formatCurrency(metrics.breakdown.acquisition.dueDiligence)}</span>
                                </div>
                                <div className="cost-item total">
                                    <span>Acquisition Total</span>
                                    <span>{formatCurrency(metrics.totalAcquisition)}</span>
                                </div>
                            </div>

                            <div className="cost-section">
                                <h3>Development Costs</h3>
